# Release: push a version tag (v0.1.0, …) and this workflow runs the tests,
# builds and smoke-tests every OS's downloads (package.yml), and attaches
# them to a GitHub release for that tag — one download per OS and installer:
#
#   Windows  OpenLustreStudio-<v>-windows-x86_64-Setup.exe, …-windows-x86_64.zip
#   Linux    openlustre-studio_<v>_amd64.deb, …-linux-x86_64.tar.gz
#   macOS    …-macos-arm64.pkg / .tar.gz (Apple Silicon), …-macos-x86_64.pkg / .tar.gz (Intel)

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  package:
    needs: test
    uses: ./.github/workflows/package.yml

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            OpenLustre Studio ${{ github.ref_name }} — for demonstration and prototyping (not a qualified tool).

            | OS | Installer | Alternative |
            |---|---|---|
            | Windows 10/11 (x64) | `OpenLustreStudio-*-windows-x86_64-Setup.exe` | `…-windows-x86_64.zip` (portable) |
            | Ubuntu 22.04+ (x64) | `openlustre-studio_*_amd64.deb` (`sudo apt install ./…deb`) | `…-linux-x86_64.tar.gz` + `./install.sh` |
            | macOS 13+ Apple Silicon | `…-macos-arm64.pkg` | `…-macos-arm64.tar.gz` + `./install.sh` |
            | macOS 13+ Intel | `…-macos-x86_64.pkg` | `…-macos-x86_64.tar.gz` + `./install.sh` |

            Linux and macOS downloads bundle the Kind 2 prover and Z3; on Windows, Kind 2 runs through WSL or Docker (see README-windows.txt). Every download ships the PMS sample: `openlustre studio launch --sample pms`.
