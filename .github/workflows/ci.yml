# Continuous integration. `test` runs the whole suite on Linux, Windows and
# macOS; `prove` installs the
# pinned Kind 2 + Z3, proves every example for real (the Kind 2 conformance
# and runtime-error tests refuse to skip there), runs the PMS project's own
# verification script with this build, and keeps the evidence reports.

name: ci

on:
  push:
  pull_request:

jobs:
  # The whole suite on each OS the Studio ships for. (Kind 2 has no Windows
  # build: its tests skip there; the `prove` job runs them on Linux.)
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  prove:
    runs-on: ubuntu-latest
    env:
      OPENLUSTRE_TOOLS: ${{ github.workspace }}/.openlustre-tools
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p ol_cli

      - name: Install Kind 2 and Z3
        run: ./target/debug/openlustre kind2 install

      - name: Check the prover
        run: ./target/debug/openlustre kind2 doctor

      - name: Kind 2 conformance and the PMS proof (no skipping)
        env:
          OPENLUSTRE_KIND2: ${{ env.OPENLUSTRE_TOOLS }}/bin/kind2
          OPENLUSTRE_Z3: ${{ env.OPENLUSTRE_TOOLS }}/bin/z3
          OPENLUSTRE_REQUIRE_KIND2: "1"
        run: cargo test -p openlustre_integration_tests --test kind2_projection --test runtime_errors --test pms_example

      - name: The PMS project's own verification, with this build
        run: OPENLUSTRE=$PWD/target/debug/openlustre examples/pms/scripts/verify.sh --quick

      # The PMS (171 properties) takes Kind 2 a few minutes on a hosted
      # runner; the timeout only caps a proof that cannot settle.
      - name: Prove the examples and build their evidence
        env:
          PROVE_TIMEOUT: "600"
        run: tools/prove-examples.sh ./target/debug/openlustre evidence

      - name: Keep the evidence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/
