# OpenLustre standard library block: rising-edge detector.
#
# This is metadata only — the IR construction happens in a builder. The YAML
# documents the block's contract and library category so the GUI can show it
# in the block palette.
name: RisingEdge
kind: operator
category: temporal
inputs:
  - { name: x, type: bool }
outputs:
  - { name: edge, type: bool }

equations:
  - lhs: [edge]
    body: "x and not (false -> pre x)"

contract:
  # Contract-local state: the first-cycle flag and the previous input
  # (false before the first cycle, exactly as the implementation reads it).
  ghosts:
    - { name: first_cycle, type: bool, body: "true -> false" }
    - { name: pre_x,       type: bool, body: "false -> pre x" }
  modes:
    # With no previous value, `pre x` reads false, so an input that is
    # already high on the first cycle IS reported as an edge.
    - name: FirstCycle
      requires:
        - "first_cycle"
      ensures:
        - "edge = x"
    - name: Rising
      requires:
        - "x and not pre_x"
      ensures:
        - "edge"
    - name: NotRising
      requires:
        - "not (x and not pre_x)"
      ensures:
        - "not edge"
